# Kill Conditions (P11: 임계 + 사전 정의 결과 쌍 필수)
# status: active = kc-eval이 로드·판정 / draft = 로드 제외(임계 미확정 — 사용자 확정 후 active로 변경)
# consequence는 전부 "검토·리뷰" 성격이다 — 매수·매도 지시가 아니다(P12·P15).
# 출처: 매크로 KC-1~10 = 투자_Thesis_Map_v32(active) / 종목 KC = 설계서 v2.1 §8-7 초안(draft)
schema_version: 1
as_of: "2026-08-15"

macro:
  KC-1:
    status: active
    description: "FFR 인상 리스크"
    all_of:
      - {metric: FFR, operator: ">", threshold: 3.75, unit: "%"}
    inputs_note: "FFR 확률(CME FedWatch)은 웹검색[LLM] 수집 — 판정 provisional 기본. 실제 FFR 확정은 FOMC 결과로만"
    consequence: "레버리지 전액 해제 + Edge/Next 50% 축소 검토"
  KC-2:
    status: active
    description: "변동성 급등"
    all_of:
      - {metric: VIX, operator: ">=", threshold: 30}
    consequence: "레버리지 해제 검토"
  KC-3:
    status: active
    description: "크립토 붕괴 + 위험회피 동시"
    all_of:
      - {metric: BTC, operator: "<", threshold: 55000, unit: "USD"}
      - {metric: VIX, operator: ">=", threshold: 25}
    consequence: "IREN 50% 축소 + Next 진입 보류 검토 (파급: IREN·COIN·HOOD·CRCL)"
  KC-4:
    status: active
    description: "유동성 위기 신호"
    all_of:
      - {metric: ON_RRP, operator: ">=", threshold: 200000000000, unit: "USD"}
      - {metric: VIX, operator: ">=", threshold: 25}
    consequence: "광범위 디리스킹 검토"
  KC-5:
    status: active   # 2026-08-15 사용자 확정 — TAIEX 중심 재정의 (v1의 P11 위반 잔존분 해소)
    description: "TAIEX 음전환 (아시아 리스크 프록시)"
    all_of:
      - {metric: TAIEX_vs_20dma_pct, operator: "<", threshold: 0, unit: "%", note: "종가가 20일 이동평균 하회"}
      - {metric: TAIEX_1m_return_pct, operator: "<", threshold: 0, unit: "%", note: "최근 1개월 수익률 음전환"}
    inputs_note: "TAIEX는 yfinance ^TWII로 [CODE] 수집. 글로벌 펀드 플로우(EPFR 등)는 유료 데이터라 판정 조건에서 제외 — 보조 서술로만 사용(웹검색 인용 시 출처·시각 기록)"
    consequence: "광범위 디리스킹 검토"
  KC-6:
    status: active
    description: "AI 토큰 지출 급감"
    all_of:
      - {metric: SDLLMTK_change_pct, operator: "<=", threshold: -30, unit: "%", duration: "2주 지속"}
    consequence: "Base·Edge 전제 재검토"
  KC-7:
    status: active
    description: "하이퍼스케일러 합산 FCF 악화"
    all_of:
      - {metric: hyperscaler_fcf_sum, operator: "<", threshold: 0, duration: "2분기 연속", note: "리스부채·SPV 보조지표 병기"}
    inputs_note: "분기 공시 기반 — 수동/EDGAR 확정. staleness 한도 100일"
    consequence: "CapEx 감속 시나리오 검토"
  KC-8:
    status: active
    description: "Microsoft FCF 마이너스 (최후의 보루)"
    all_of:
      - {metric: msft_fcf, operator: "<", threshold: 0}
    consequence: "AI CapEx 축 전면 재검토"
  KC-9:
    status: active
    description: "에너지 쇼크"
    all_of:
      - {metric: brent, operator: ">=", threshold: 120, unit: "USD", duration: "1개월 지속"}
    consequence: "에너지+인플레이션 시나리오 검토"
  KC-10:
    status: active
    type: event   # 이벤트형 — 지표 피드가 아니라 공시 관측
    description: "IREN 전력·인허가 이벤트"
    trigger: "IREN 계약 용량의 10%+ 강제 감축 대상 분류, 또는 보유 사이트 전력접속·인허가 취소·보류 공시"
    consequence: "Edge 마진 전제 재검토"

# IREN 개별 가격 라인 (v32 불변 승계)
price_lines:
  IREN:
    - {level: 30, unit: "USD 종가", action: "추가 매수 정지"}
    - {level: 28, unit: "USD 종가", action: "포지션 리뷰"}

# ── 종목별 KC — 설계서 §8-7 초안. 지표는 인터뷰에서 사용자 확정, ⚠️수치는 전부 초안.
# 검토 후 status: active로 변경해야 로드된다.
company:
  KC-CRCL-1:
    status: active   # 2026-08-15 사용자 확정 — 2단 분리 구조
    ticker: CRCL
    description: "USDC 유통량 수축 (경고/발동 2단)"
    warning:   # 단독 충족 시 경고(알림만) — 온체인 상시 관측
      - {metric: usdc_circulation_30d_avg_vs_90d_peak, operator: "<=", threshold: -20, unit: "%"}
    all_of:    # 발동(kill) — 경고 조건 + RI 동반
      - {metric: usdc_circulation_30d_avg_vs_90d_peak, operator: "<=", threshold: -20, unit: "%"}
      - {metric: reserve_income_qoq_declines, operator: ">=", threshold: 2, unit: "분기 연속", note: "v1 승계"}
    consequence: "경고: 알림 + 관측 강화 / 발동: Next 진입 보류 + 포지션 리뷰"
  KC-CRCL-2:
    status: active   # 2026-08-15 사용자 확정 — 초안 -5%p에서 -3%p로 민감화 / 같은 날 분모 계열 확정(esc_20260815_2307_kccrcl2_denominator 해소)
    ticker: CRCL
    description: "점유율 잠식 (OUSD·이자부 코인 포함)"
    all_of:
      - {metric: usdc_stablecoin_share_qoq, operator: "<=", threshold: -3, unit: "%p",
         note: "판정 분모 = 회사 정의 계열(2026-08-15 사용자 확정): Circle 공시 기준 — 유통량 $100M 이상·정기 어테스테이션 보유 미(美)달러 스테이블코인 한정. grade 1 분기 관측(Q2'26 27%, QoQ -1%p). DefiLlama 등 3자 집계(전체 공급 분모, 약 24% — 약 3%p 낮음)는 삼각검증·주단위 조기 경보용으로만 사용, 판정 계열 아님(P4). 두 계열 수치 혼용 금지 — QoQ 비교는 반드시 동일 계열 내에서만"}
    consequence: "'파이 성장 > 침식' 전제 재검토"
  KC-CRCL-3:
    status: active   # 2026-08-15 사용자 확정 — 모든 변경 공시 즉시
    ticker: CRCL
    type: event
    description: "Coinbase 분배 계약 변경"
    trigger: "분배율 상향·구조 변경 공시 발생 (경중 불문 즉시)"
    consequence: "Reserve Income 마진 재산출 + 포지션 리뷰 (KC-COIN-4 교차 참조)"
  KC-CRCL-4:
    status: active   # 2026-08-16 사용자 확정 — 신설(2단 구조 + GENIUS 경로 포함). 배경: regulation 축 P8 분해(run 20260815_2307)로 회사 인허가 관측 단위가 분리됐으나 대응 KC 부재(CRCL은 COIN-3 상당의 규제 조치형 KC가 없던 공백)
    ticker: CRCL
    type: event
    description: "인가·감독 조치 (규제 선점 전제 훼손 — regulation_company_licensing 축 연결)"
    warning_trigger: "Circle 신탁 법인(OCC National Trust·NYDFS Trust) 대상 공식 감독 조치 개시 공시 — formal agreement, 공식 조사 확인, 인가 조건 위반 통지. 또는 GENIUS Act 발행자 인가·등록 절차의 거부 가능성 시사·중대 보완 요구 공시"
    trigger: "OCC·NYDFS 인가의 취소·정지·중대 영업 제한(consent order·C&D 포함) 공시, 또는 GENIUS Act 발행자 인가 거부·철회 확정"
    scope_note: "절차적 서류 보완·정기 검사·'검토 중' 루머 보도는 미발동(노이즈 필터 승격은 가능). 근거는 1차 공시 또는 인가 기관 공식 발표만(F1·P4)"
    consequence: "경고: 알림 + 관측 강화 / 발동: '규제 선점' 전제 재검토 + regulation_company_licensing 축 재평가"
  KC-COIN-1:
    status: active   # 2026-08-15 사용자 확정 — v1 카드 구조로 교체 (사이클 노이즈 내성)
    ticker: COIN
    description: "구조 전환 실패 (구독 비중 하락 + 거래 매출 동반 감소)"
    all_of:
      - {metric: subscription_services_share_declines, operator: ">=", threshold: 2, unit: "분기 연속"}
      - {metric: transaction_revenue_qoq, operator: "<", threshold: 0, unit: "%", note: "동반 감소 조건"}
    consequence: "비중 조절 검토 (단순 약세장 거래 감소는 미발동 — 구독 비중 동반 하락 시에만)"
  KC-COIN-2:
    status: active   # 2026-08-15 사용자 확정 — 가격효과 제외 기준 명시
    ticker: COIN
    description: "예치자산 순유출 (가격 변동 제외)"
    all_of:
      - {metric: platform_assets_net_outflow_quarters, operator: ">=", threshold: 2, unit: "분기 연속",
         note: "측정 기준: 회사가 공시하는 net inflow/outflow (가격효과 제외). 해당 수치 미공시 분기는 unconfirmed 처리 — 명목 잔액 변화로 대체 판정 금지(F3)"}
    consequence: "구조 전환(구독 비중) thesis 재검토"
  KC-COIN-3:
    status: active   # 2026-08-15 사용자 확정 — 연방 기관 + 영업상 중대로 한정
    ticker: COIN
    type: event
    description: "규제 소송 (중대 건 한정)"
    trigger: "SEC·CFTC·DOJ의 신규 제소, 또는 주요 사업(거래·스테이킹·스테이블코인) 대상 영업정지·인가 취소. 주주 집단소송·경미한 주정부 행정조치는 노이즈 처리(알림 승격은 가능)"
    consequence: "규제 수혜 전제 재검토"
  KC-COIN-4:
    status: active   # 2026-08-15 사용자 확정 — 방향 조건 추가 (유리한 분배 변경은 미발동)
    ticker: COIN
    description: "USDC 연동 수익 훼손 (교차 KC, 방향 조건부)"
    any_of:
      - {metric: usdc_revenue_qoq, operator: "<=", threshold: -25, unit: "%"}
      - {metric: kc_crcl_3_adverse_to_coin, operator: "==", threshold: true,
         note: "KC-CRCL-3 발동 건 중 COIN에 불리한 방향(COIN 수취 분배율 하향·계약 축소)만. 유리한 변경은 미발동 — 단 알림은 유지(usdc_economics 축 재료)"}
    consequence: "USDC 수익-OUSD 상충 점검"
  KC-HOOD-1:
    status: active   # 2026-08-15 사용자 확정 — COIN-1과 동일 패턴 (사이클 노이즈 내성)
    ticker: HOOD
    description: "거래 매출 감소 + 고객 기반 동반 훼손"
    all_of:
      - {metric: trading_revenue_qoq, operator: "<", threshold: 0, unit: "%", note: "크립토+옵션 합산"}
      - {metric: net_deposits_growth_declines, operator: ">=", threshold: 2, unit: "분기 연속", note: "순입금·AUA 증가세 동반 꺾임 — 거래 감소여도 고객 기반 성장 중이면 미발동"}
    consequence: "비중 조절 검토"
  KC-HOOD-2:
    status: active   # 2026-08-15 사용자 확정 — 2단 구조로 민감화
    ticker: HOOD
    description: "순입금 유출 전환 (경고/발동 2단)"
    warning:   # 월단위 공시 활용 조기 경보
      - {metric: net_deposits_quarterly_outflow_plus_next_month, operator: "==", threshold: true, note: "분기 순유출 1회 + 익월 유출 지속"}
    all_of:    # 발동
      - {metric: net_deposits_outflow_quarters, operator: ">=", threshold: 2, unit: "분기 연속"}
    consequence: "경고: 알림 + 관측 강화 / 발동: AUA 성장 thesis 재검토"
  KC-HOOD-3:
    status: active   # 2026-08-15 사용자 확정 — 연방 또는 상위 3주 기준
    ticker: HOOD
    type: event
    description: "예측시장 규제 금지 (중대 건 한정)"
    trigger: "CFTC/연방 차원 금지, 또는 HOOD 예측시장 매출 기여 상위 주 중 3개 이상 동시 금지. 개별 소규모 주 금지는 알림만(노이즈 아님, 발동 아님)"
    consequence: "매출 mix thesis 축소 재평가"
  KC-NBIS-1:
    status: active   # 2026-08-15 사용자 확정 — 앵커 범위를 $1B+ 계약 전체로 확대
    ticker: NBIS
    type: event
    description: "대형 고객 계약 훼손 ($1B+ 전체)"
    trigger: "Meta·MS 및 $1B 이상 계약 고객(Reflection·Cohere 등 Q2 신규 4사 포함)의 해지·규모 20%+ 축소·재협상 공시"
    consequence: "포지션 리뷰"
  KC-NBIS-2:
    status: active   # 2026-08-15 사용자 확정 — 경고/발동 2단으로 민감화
    ticker: NBIS
    description: "용량 인도 지연 (경고/발동 2단)"
    warning:
      - {metric: delivery_delay_quarters, operator: ">=", threshold: 1, unit: "분기", note: "late Q4 온라인 전환·연말 5GW 목표 대비 1분기 지연 발표 시 경고"}
    any_of:   # 발동
      - {metric: capacity_delivery_delay_months, operator: ">=", threshold: 6, unit: "개월"}
      - {metric: delivery_delay_quarters, operator: ">=", threshold: 2, unit: "분기 연속"}
    consequence: "경고: 알림 + 관측 강화 / 발동: 실행 리스크 상향"
  KC-NBIS-3:
    status: active   # 2026-08-15 사용자 확정 — 현금 하한 $3B → $5B 상향 (CapEx 집행 속도 감안)
    ticker: NBIS
    description: "조달 조건 악화"
    any_of:
      - {metric: cash_balance, operator: "<", threshold: 5000000000, unit: "USD", note: "추가 조달 실패 동반 시. v1의 $3B에서 상향"}
      - {metric: new_debt_spread_vs_prior_bp, operator: ">=", threshold: 300, unit: "bp"}
    consequence: "저희석 확장 thesis 재검토"
  KC-CRWV-1:
    status: active   # 2026-08-15 사용자 확정 — NBIS-1과 동일 기준 ($1B+ 전체)
    ticker: CRWV
    type: event
    description: "대형 고객 계약 훼손 ($1B+ 전체)"
    trigger: "OpenAI·Meta·MS 및 $1B 이상 계약 고객의 해지·규모 20%+ 축소·재협상 공시"
    consequence: "포지션 리뷰 (백로그가 레버리지 상환 재원 — 훼손은 생존 문제 직결)"
  KC-CRWV-2:
    status: active   # 2026-08-15 사용자 확정 — NBIS-2와 동일 2단 구조
    ticker: CRWV
    description: "용량·차세대 GPU 배포 지연 (경고/발동 2단)"
    warning:
      - {metric: delivery_delay_quarters, operator: ">=", threshold: 1, unit: "분기", note: "Vera Rubin 등 공시 일정 대비 1분기 지연 발표 시 경고"}
    any_of:   # 발동
      - {metric: deployment_delay_months, operator: ">=", threshold: 6, unit: "개월"}
      - {metric: delivery_delay_quarters, operator: ">=", threshold: 2, unit: "분기 연속"}
    consequence: "경고: 알림 + 관측 강화 / 발동: 실행 리스크 상향"
  KC-CRWV-3:
    status: active   # 2026-08-15 사용자 확정 — v1 승계 확정 (현 ~2.2x는 재대조 대기 u_001)
    ticker: CRWV
    description: "이자 커버리지·차환 (경고/발동 2단)"
    any_of:
      - {metric: interest_coverage, operator: "<", threshold: 1.5, unit: "x", severity: warning, note: "경고 단계. 분자·분모 정의(EBITDA 기준) 명시 필수"}
      - {metric: interest_coverage, operator: "<", threshold: 1.0, unit: "x", severity: kill, note: "발동 단계 (v1 승계)"}
      - {metric: refinancing_failure_or_covenant_breach, operator: "==", threshold: true, severity: kill, note: "즉시 발동"}
    consequence: "사전 정의 축소 시나리오 검토"

# 미채택 기록 (감사 추적, 설계서 §8-7): CRCL 디페그 지속, NBIS·CRWV 희석 증자 반복 — 인터뷰에서 KC 미채택.
