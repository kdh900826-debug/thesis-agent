# 잡뉴스 필터 (P3) — noise-triage 스킬이 사용. 애매하면 승격(보수적, v1 §9-2).
# promote_if: 노이즈 패턴이라도 이 조건 중 하나를 포함하면 알림 승격.
schema_version: 1

common:
  noise:
    - "단순 주가 변동·일간 등락"
    - "컨퍼런스 참석·반복 홍보성 뉴스"
    - "소셜미디어 루머·리테일 센티먼트 지표 (Stocktwits 등)"
    - "애널리스트 PT·투자의견 변경 단독"
    - "파트너십 MOU (매출 전환 없는 한)"
    - "지수 편입 후속 보도"
    - "패시브 13G 지분 보도의 '기관 매수 = 강세' 해석"
    - "벤치마크·인증 결과 단독"
    - "원출처 없는 정량 수치 인용 보도"
    - "유튜브·방송 해설자의 목표치·붕괴 확률 발언"
    - "'AI 버블 붕괴' 확대 해석 (FCF·토큰 데이터 없는 기사)"
  promote_if:
    - "신규 고객명 공개 / 대형 주문·production order"
    - "양산·인도 일정 변경"
    - "가이던스 상향/하향, 마진·현금흐름 변화"
    - "유상증자·전환사채·워런트 등 희석 이벤트"
    - "파트너십의 실제 매출 전환"
    - "경영진·거버넌스·자본배분 리스크"
    - "KC 트리거 및 접근"
    - "규제 확정 이벤트 (CLARITY, SEC 면제, SB6·PUCT — 발의가 아닌 시행·확정)"

IREN:
  noise:
    - "Horizon 1 인수 반복 보도 (v32 반영 완료)"
    - "NVIDIA Exemplar Cloud '인증 = 수주' 연결 (주문·고객·매출 데이터 없음)"
    - "Russell 1000·Warriors·RSU·CISO 반복 보도"
    - "$2.8B 계약 반복 보도 (v19 반영 완료)"
    - "'네오클라우드 마진 개선' 일반론 (IREN 특정 데이터 없음)"
    - "'EPS 적자 = 매도' 단순 해석 (일회성 비용 미분리)"
    - "Mirantis '인수 완료 = 주가 상승' 류"
  promote_if:
    - "Horizon 1 매출 인식 금액·시점"
    - "Horizons 2-4 구체 일정"
    - "인수(acceptance) 계약 조건 원문 공개"
    - "DC 모라토리엄: 시행(EO·법 서명) / 텍사스·BC 관할 / IREN 계약 용량 영향"

