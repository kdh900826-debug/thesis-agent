# 자료 등급 서열 (P4) — 도메인 → evidence_grade 매핑
# 1=1차 공시·회사 발표 / 2=경영진 직접 발언(원문 인용) / 3=2차 매체 / 4=애그리게이터·기타
# ③④는 삼각검증용. 단독 판단 근거 사용 불가. 미등재 도메인은 default_grade.
schema_version: 1
default_grade: 4

grade_1:
  - sec.gov                # EDGAR 공시 원문
  - efts.sec.gov
  - globenewswire.com      # 회사 보도자료 유통
  - businesswire.com
  - prnewswire.com
  - irenlimited.com        # 회사 IR (예시 — 종목별 IR 도메인은 확인 후 추가)
  - nebius.com
  - coreweave.com
  - micron.com
  - circle.com
  - coinbase.com
  - robinhood.com
  - federalreserve.gov     # 매크로 1차
  - newyorkfed.org
  - fred.stlouisfed.org
  - congress.gov           # 법안 원문
  - puc.texas.gov          # PUCT (SB6)

grade_2:
  # 경영진 발언 직접 인용이 확인되는 경우에만 2. 스크립트는 도메인만으로 2를 부여하지 않는다 —
  # L2 에이전트가 "직접 인용 여부"를 확인해 수동 부여.
  - seekingalpha.com/earnings/earnings-call-transcripts

grade_3:
  - reuters.com
  - bloomberg.com
  - wsj.com
  - ft.com
  - cnbc.com
  - theinformation.com
  - coindesk.com
  - theblock.co
  - datacenterdynamics.com

grade_4:
  - stocktitan.net         # 실적일 확인에는 유효하나 판정 근거 불가 (F1)
  - finance.yahoo.com
  - stocktwits.com
  - reddit.com
  - youtube.com

rules:
  - "웹검색[LLM] 수집 항목은 도메인 매핑 등급을 부여하되, 1차 자료 URL 역추적을 의무화한다(D15). 역추적 실패 시 grade는 그대로 두고 confirmed=false."
  - "애그리게이터 캘린더의 자동 추정 라벨(실적일 등)은 grade와 무관하게 판정 근거 불가(F1). 회사 IR 공지로만 확정."
  - "naver.me 단축링크·네이버 블로그 직접 URL은 접근 불가 — 사용자에게 본문 붙여넣기 요청."
