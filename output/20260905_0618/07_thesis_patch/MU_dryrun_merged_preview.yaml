thesis: >
  HBM 수요가 AI CapEx에 직접 연동되는 구간에서, SCA(장기공급계약)·take-or-pay·최소가격 보장
  구조를 통해 CXMT/YMTC發 commodity DRAM 침식을 구조적으로 방어하고 매출 가시성을 확보한다.

