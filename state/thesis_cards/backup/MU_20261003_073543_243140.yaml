026-09-25 관측점 갱신(ThesisPatch amend, run 20260925_1015) — ⑤ [fact · grade 1 · confirmed] USITC가 2026-09-24 Netlist 제소(2026-08-11 접수, 2026-08-25 보충서)에 기반해 Investigation No. 337-TA-1523(Certain DRAM Devices, Products Containing the Same, and Components Thereof (III))의 조사개시(institution)를 표결했다 — 대상 특허 4건(US 10,025,731 / 10,217,523 / 12,373,366 / 12,675,407), 피조사자 Micron Technology·Supermicro·HPE·Lenovo 4개사, Netlist는 배제명령·중지명령 청구(c_20260925_MU_3 — Netlist 보도자료 + 5개 독립 매체 교차 일치, usitc.gov 원문은 403으로 직접 확인 실패). [inference · strong] 대상 특허 4건·피조사자 구성이 일치하므로 ②의 DN 3930 제소와 동일 건으로 본다. ②에 기록된 '조사개시 공고 미게재' 상태는 이로써 해소됐다(② 원문은 P9에 따라 보존). 제소 접수일은 c_3 기준 2026-08-11로, 본 축 서두의 2026-08-12와 불일치하나 어느 쪽도 정정하지 않고 병기한다(P9). ⚠️조사개시 ≠ 위반 판정 ≠ 배제명령 집행 ≠ 매출 영향 — 단계를 분리하며 매출·마진 영향은 미확인이다(P5·P7). 법률 절차의 진행이지 매출·마진·현금흐름·가이던스 수치가 아니므로 등급 상향 근거로 쓸 수 없다(P2). [inference · moderate] L2 delta는 절차가 실체 심리 단계로 정식 진입했다는 이유로 이 축을 weaken(리스크 악화) 방향으로 표기했다. ⑥ [확인 대상 · grade 4 · confirmed=false · 단독 근거 부적격(P4)] CDCA 8:26-cv-02167의 주장 특허는 US 10,217,523 / 12,675,407 2건으로 보도되며 337-TA-1523 대상 4건의 부분집합이다(c_20260925_MU_4). 도켓 원문 미확보이며 연장 후 답변시한은 여전히 미특정이다. ⑦ [확인 대상 · grade 4 · confirmed=false · 단독 근거 부적격(P4)] D.Del 1:26-cv-01014의 대상 특허는 US 9,128,632 / 10,217,523 / 12,675,407 3건으로 조회되고(④의 '대상 특허 미확인'에 대한 확인 대상 갱신), Netlist 답변시한은 2026-10-01로 재연장됐으며, 2026-09-25 기준 답변·§1659 정지 신청은 도켓에 등재되지 않았다(c_20260925_MU_5). ⑧ [fact · grade 1 · confirmed] CAFC 2025-1936은 2026-09-09 구두변론 이후 2026-09-25 시점까지 선고가 게시되지 않았다(c_20260925_MU_6). [inference · moderate · grade 4 의존] ⑥⑦이 확인되면 ITC·CDCA·D.Del 3개 절차는 별건이 아니라 동일 특허군(10,217,523 / 12,675,407)을 둘러싼 다중 전선이다. 추적점(재갱신): 337-TA-1523 ALJ 배정·목표완결일(target date)·증거개시 일정 / D.Del 1:26-cv-01014 2026-10-01 답변 및 §1659 정지 신청 여부(grade 4 확인 대상) / CDCA 8:26-cv-02167 확정 답변시한·답변 내용(grade 4 확인 대상) / CAFC 2025-1936 선고 / 2026-09-30 FY26 Q4 실적 발표·콜의 소송 기술(earnings_checkpoints 참조)"}

thesis: >
  HBM 수요가 AI CapEx에 직접 연동되는 구간에서, SCA(장기공급계약)·take-or-pay·최소가격 보장
  구조를 통해 CXMT/YMTC發 commodity DRAM 침식을 구조적으로 방어하고 매출 가시성을 확보한다.

