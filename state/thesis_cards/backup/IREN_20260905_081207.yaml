thesis: >
  토지·전력·DC·GPU 수직 통합으로 임차형 대비 구조적 마진 우위(자체 ~14% vs 임차 ~5%)를 확보한
  사업자가, BTC 채굴 현금흐름을 AI Cloud 계약 매출로 전환한다.
  MS $9.7B + NVIDIA $3.4B + 신규 $2.8B = TCV ~$15.9B. Mirantis 인수로 소프트웨어 레이어 보강.

