  # 이전 primary: "EV/ARR (현 ~5.7x = $45.12×508M≈$22.9B ÷ $4.0B, 순부채 미조정) + MW당 매출"
  primary: >-
    EV/ARR — ⚠️단일값 금지. 분모를 명시하지 않은 EV/ARR은 무효다.
    [분모 A = 계약 ARR $4.0B] EV/ARR 3.55x~5.01x. [분모 B = 가동 중 ARR $1.0B(8/26)] EV/ARR 14.19x~20.02x.
    분자 range: 주가 $35.45(8/28 종가, grade 3) × 주식수 394,058,648(하한) ~ 558,718,254(상한) = 시총 $13,969M~$19,807M,
    순부채 ~$217M 가산 시 EV $14,187M~$20,024M.
    카드 기준선 5.73x 대비 변동은 전액 분자 기여이며 분모 기여는 0이다 —
    가격 -21.4%($45.12→$35.45)가 5.73x→4.50x, 주식수 변경(508M→394.06M 또는 558.72M)이 4.50x→3.49x 또는 4.95x(순부채 미조정 기준).
    분모 A와 B의 차이는 밸류에이션 변동이 아니라 기준 변경이므로 시계열로 나란히 놓지 않는다.
  secondary: "완전희석 시총(range 필수, F9), 인도 MW 진척률(⚠️0.3GW IT vs 480MW 기준 상충), RPO+리스 계약가치 ~$16.6B(ASC606 $5.1B + ASC842 $11.4B)"
  caution: >-
    BTC 매출과 AI Cloud 매출에 동일 멀티플 적용 부적절 — Q4 FY26 기준 매출의 48.6%가 여전히 채굴이며 해당 부문은 QoQ -40.0%다.
    또한 ARR은 비GAAP 운영지표이며 회사가 "인식 매출은 실질적으로 더 낮을 수 있다"고 명시했으므로 ARR 기반 배수는 GAAP 매출 배수와 혼용하지 않는다.
    Microsoft·Horizon 계약은 ASC842 리스로 분류돼 FY26 손익계산서에 매출 인식액이 0이다 — 현 매출 배수에 thesis 핵심 계약이 반영돼 있지 않다.

conclusion: >
  계약의 물리적 이행은 1단계에 한해 입증됐으나 재무적 전환은 8/27에 처음 계량된다.
  상향 게이트는 정량 수치이며, 인도 완료 자체는 홀딩 강화 신호에 그친다.
