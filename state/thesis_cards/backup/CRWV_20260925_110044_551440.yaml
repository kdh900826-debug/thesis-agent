  - {id: margin_trend,      label: "Adj. EBITDA 마진 추세 — ⚠️기준 기간 명시 필요. YoY 기준: Q2 59%(전년 62%)·H1 57%(전년 62%)로 압축 / 시퀀셜 기준: Q1 약 56%→Q2 59%로 개선. 기준에 따라 방향이 반대이므로 축 판정 시 기준을 먼저 고정한다 ⚠️갱신 [⚠️ 2026-09-19 기준 병기 주석(run 20260919_2209) — 2026-09-17 8-K Ex 99.2 34p가 5분기 Adj. EBITDA 조정표를 1차 공시해(c_20260919_CRWV_5, grade 1 fact, confirmed) 두 기준의 실측치가 모두 확정됐다. 분기 마진 실측: Q2'25 62% → Q3'25 61% → Q4'25 57% → Q1'26 56% → Q2'26 59%. (가) YoY 기준(Q2'26 59% 대 Q2'25 62%) = -3%p, 부호 압축. (나) 시퀀셜 기준(Q1'26 56% → Q2'26 59%) = +3%p, 부호 개선(Q1'26이 5분기 저점). 동일한 1차 수치에서 두 부호가 병존하므로, 어느 기준을 축 판정 기준으로 채택할지가 곧 방향 부호의 결정이다. 이는 측정 정의의 선택이지 관측의 판정이 아니므로 에이전트는 어느 편도 채택하지 않는다 — 기준 확정은 사람 결정 대기(CLAUDE.md §9, P2/P15). 참고 선행 단가지표(c_20260919_CRWV_11, grade 1 fact): 2026-07 SKU 전반 약 70% 가격 인상, Q2 체결계약 기대 contribution margin이 최근 분기 대비 약 25% 높음, Q3 단기계약 약 $40M/MW(+5~10%p). 단 회사 예시곡선은 다수 배치 동시 램프 시 aggregate contribution margin이 단기 25%→5%로 압축된 뒤 'mid 20%s' 안정화를 제시한 예시치이며 실적이 아니다. 기준 확정 시 (가)/(나) 중 하나를 축 판정 기준으로 고정하고 나머지는 참고치로 남긴다. 본 주석은 기존 라벨 서술을 삭제하지 않고 병기만 한다(P9)] [✅ 2026-09-20 기준 확정(사용자 결정, run 20260919_2209 후속) — 축 판정 기준 = 시퀀셜(QoQ). YoY는 참고치로만 병기 유지. 확정 기준 적용 시 현재 실측 부호: Q1'26 56% → Q2'26 59% = +3%p(개선 방향, c_20260919_CRWV_5 grade 1 fact). 채택 사유(사용자): 분기마다 규모가 구조적으로 바뀌는 확장기라 전년 동기는 사실상 다른 사업체이며 YoY는 추세 전환을 최대 3분기 늦게 반영. 후속: key_metrics '마진 59%로 하락 추세'·risks '마진 하락 추세(59%)' 문구는 YoY 전제이므로 차기 run L2가 확정 기준으로 재판정 후 정정 후보 상정. 확정 주체: 사람(CLAUDE.md §9, P2/P15) — 에이전트 판정 아님]"}
