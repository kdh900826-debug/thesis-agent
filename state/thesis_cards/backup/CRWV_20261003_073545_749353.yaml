thesis: >
  네오클라우드 스케일 1위. 대규모 백로그를 레버리지로 건설하고 매출로 상환하는 모델.
  Full-stack + 소프트웨어(Mission Control, ARIA) + NVIDIA 지분·백스톱으로 GPU 공급 최우선권.

