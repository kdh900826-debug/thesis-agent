  - "이자 커버리지 — ⚠️계산기준 미확정. 분자(Adj. EBITDA / GAAP 영업이익 중 택1)·분모(순이자비용 / 총이자비용 중 택1)·기간(분기 연환산 / TTM 중 택1)을 확정해야 KC-CRWV-3 판정이 가능하다. 임계는 1.5x 이하 경고·1.0x 이하 발동(KC-CRWV-3). 카드상 '현 ~2.2x'는 직전 세션 확인분으로 1차 자료 재대조 미완 ⚠️갱신 [⚠️ 2026-09-19 산식 병기 주석(run 20260919_2209) — (1) 분자·분모 공백 해소: 2026-09-17 8-K Ex 99.2 34p가 분기별 Adj. EBITDA 조정표와 'Interest expense, net' 단일 라인을 1차 공시했다(c_20260919_CRWV_5, grade 1 fact). 따라서 분자 = Adj. EBITDA, 분모 = Interest expense, net이 유일하게 산출 가능한 조합이다 — 회사가 총이자비용·자본화이자·이자수익을 분리공시하지 않아 '총이자비용 기준' 변형은 이번 창 자료로 산출 불가능하다. (2) 기간 두 기준 실측 병기(c_20260919_CRWV_6, inference:strong — 회사 직접 공시 지표가 아닌 산술 결합 파생값): (가) 분기 연환산 기준 = Q2'26 1,510/640 = 약 2.36x(분자·분모를 같이 4배하므로 분기 원비율과 수치 동일). (나) TTM 기준(Q3'25~Q2'26) = 4,403/1,875 = 약 2.35x. 분기 추이는 Q2'25 2.82x → Q3'25 2.69x → Q4'25 2.31x → Q1'26 2.16x → Q2'26 2.36x이며, 카드상 '현 ~2.2x'는 Q1'26(2.16x) 시점에 가장 근접한 값이다(오기가 아니라 시점 차). (3) 이번 회차 KC-CRWV-3 판정에는 기간 채택이 영향을 주지 않았다 — (가)·(나) 어느 기준이든 경고 1.5x·발동 1.0x를 모두 상회해 03_signal/CRWV.json은 not_met/confirmed로 기록했다. 단 conclusion의 진입 검토 조건 '이자 커버리지 3x 이상'까지의 잔여 거리는 기준별로 달라지므로 채택 확정이 필요하다. (4) 참고: 신규 전환사채 $3.7B/2.875%(c_20260919_CRWV_1·c_20260919_CRWV_14)의 연 추가이자 약 $106M을 TTM 분모에 단순 가산하면 약 2.22x이나, 이는 조달금 운용 이자수익·DDTL 5.5 이자·Adj. EBITDA 증가분을 반영하지 않은 정태적 예시 계산이다. (5) TTM 대 분기연환산 중 어느 쪽을 KC-CRWV-3 공식 산식으로 채택할지는 KC 임계·지표정의 확정 영역이므로 에이전트는 채택하지 않고 병기만 한다 — 사람 결정 대기(P11, CLAUDE.md §9, U4). (6) 잔여 공백: 총이자비용·자본화이자·이자수익 분리 수치는 미공시로 Q3 2026 10-Q 대기(unconfirmed 이월). 본 주석은 기존 서술을 삭제하지 않고 병기만 한다(P9)] [✅ 2026-09-20 산식 확정(사용자 결정, run 20260919_2209 후속) — KC-CRWV-3 공식 산식 = Adj. EBITDA ÷ Interest expense, net · 기간 = 분기 연환산(최근 분기 비율). 현재값 Q2'26 2.36x(c_20260919_CRWV_6). TTM(2.35x)은 참고치. 채택 사유(사용자): 순이자비용이 5분기간 $267M→$640M으로 급증하는 국면에서 KC는 조기 경보 도구이므로 현재 부담 즉시 반영이 우선, 분기 일회성 노이즈는 경고 1.5x/발동 1.0x 2단 구조가 완충. conclusion 진입 조건 '3x 이상'까지 잔여 거리 = 0.64x(2.36x 기준). config/kill_conditions.yaml#company.KC-CRWV-3 note의 산식 명문화는 사용자 편집 영역 — 제안문 별첨(에이전트 미수정). 확정 주체: 사람(P11, §9, U4)] [ℹ️ 2026-09-25 전환사채 결제 확정 주석(run 20260925_1015) — 위 (4)의 '$3.7B/2.875%' 전제는 가격결정 단계 수치이며, 2026-09-22 8-K로 결제가 완료됐다: 추가매입옵션 $500M 전액 행사로 확정 발행규모 $4.2B(2.875%, 2033 만기), 순수취금 $4,137.0M, capped call 실비 약 $566.2M(c_20260925_CRWV_1, grade 1 fact). 확정 규모로 재계산한 연 추가이자 약 $120.75M을 TTM 분모에 정태 가산하면 약 2.21x(종전 $3.7B 가정 2.22x 대비 -0.01x, c_20260925_CRWV_2, inference:weak — 운용 이자수익·DDTL 5.5 이자·EBITDA 증가분 미반영 예시). 공식 산식(분기 연환산) 실측치는 Q3 2026 10-Q 대기. (4)의 원 서술은 당시 시점 기록으로 삭제하지 않고 보존한다(P9)]"
