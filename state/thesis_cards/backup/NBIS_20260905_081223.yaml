thesis: >
  순현금 재무구조 + 최고 성장률 + 고객 선불금 기반 저희석 확장. Full-stack + 소프트웨어
  (Token Factory, Echo) 보유로 MW당 수익화에서 bare-metal 대비 우위. NVIDIA·Meta 엔도스먼트.
  [⚠️ 2026-09-05 재대조·결제 확정 주석(run 20260905_0618) — 2026-08-15 주석이 보류한 이자부 부채 총액 재대조를 완료하고,
  만료된 2026-08-20 주석 패치(ap_20260820_2235_thesis_patch_nbis_debt_annotate)를 최신 사실로 재생성한다.
  (1) 6/30/26 기준(6-K Ex-99.2, grade 1): 전환사채 원금 $10,041.8M·상각후원가 $8,499.0M(6개 시리즈, Note 12),
  Debt 유동+비유동 $8,545.7M > 현금 $8,042.1M. 종전 기재 $4,337.5M은 2026년 3월 발행분만의 부분치였다.
  운용리스 $1,625.3M 별도, 금융리스 유무 미확인, ABL $775M(SOFR+2.50%, 7/10)은 6/30 미반영.
  (2) 2026-08-24 신규 전환사채 클로징 완료(6-K Ex-99.1, grade 1): 최초매수인 그린슈 옵션 전액 행사로 발행 원금이
  $5.0B에서 $5.75B로 확대(2030년물 0.50% $3.45B + 2034년물 4.50% $2.3B). 기존 2029·2031년물 $800M의
  Class A 약 15.8M주 지분교환은 계약 체결 단계로 재확인되나 주식 인도 완료 시점은 동 문서에 명시되지 않아 unconfirmed(P7 3단 분리).
  (3) 전환사채 원금 총액은 $10,041.8M + $5,750M − $800M = 약 $14,991.8M 수준으로 추정된다(inference:medium) —
  직전 run이 제시한 범위 $14.2~15.0B의 상단이 실현되는 방향. 총 발행대금 $5.75B(gross) 유입 시 현금은 약 $13.79B
  수준일 수 있으나 발행 수수료·할인이 공시문에 없어 순조달액은 확정 불가 — 확정 수치는 Q3 2026 재무제표에서 재검증한다.
  (4) 상충 프레임: 같은 사건이 두 축에 반대 부호로 걸린다. leverage_burden 훼손(원금 총액 확대·듀레이션 이관)과
  funding_access 강화(최초 launch $4.50B 대비 +27.8%, upsize 확정 $5.0B 대비 +15%가 결제 단계까지 완결)가 동시 성립하므로
  한 부호로 합산하지 않는다. 조달의 양은 강화됐고 조달의 질(비희석·비부채)은 개선되지 않았다.
  "순현금 재무구조"·"저희석 확장" 문장 자체의 유지/재작성은 핵심 논거 판정이므로 자동 패치하지 않는다 —
  esc_20260905_0618_nbis_thesis_rewrite로 사람 결정 대기. 2026-08-20 에스컬레이션의 선택지 C(8/24 결제 확인 후 판정)의
  전제 조건은 본 주석으로 충족됐다]

