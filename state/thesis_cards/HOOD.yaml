  - {id: prediction_market_federal_jurisdiction, label: "예측시장 규제 — 연방(CFTC·연방법원) 관할 경로. 관측 단위: 연방 전속관할을 확인·부인하는 절차의 진척과 그 계류 상태. 2026-09 관측 — CFTC가 D.Conn.에 코네티컷 주법 집행을 막는 예비적 금지명령을 신청하고 Robinhood가 소송참가를 신청(2026-09-11, 둘 다 계류, c_20260919_HOOD_5). Robinhood·Crypto.com의 연방대법원 상고 제출(제출일 2026-09-06/09-09로 매체 불일치, 도켓번호 미부여, 첫 검토 기회 2026-09-28 long conference, c_20260919_HOOD_9). 주 경로와 부호가 반대이며 시간 순서도 다르다 — 주 경로의 가장 무거운 사건(미시간 09-04 서명)이 CLARITY 클로처 표결(2026-09-15)에 선행한다. ⚠️본 경로의 관측 사실도 전부 evidence_grade 4·confirmed=false(cftc.gov·supremecourt.gov 미등재 사유) — 단독 판단 근거 불가(P4). 다음 관측점: 2026-09-28 SCOTUS long conference 처리, D.Conn. 예비적 금지명령·소송참가 인용 여부, CLARITY 재의동의 후 2차 클로처 실시 여부 [2026-10-01 관측 주석(annotate, run 20261001_0900) — 위 원문(9/28 long conference 관측점 포함)은 P9에 따라 보존. (1)[확인 대상 · grade 4 · confirmed=false — supremecourt.gov 원문 직접 조회이나 sources.yaml 미등재 도메인 사유] 상고 도켓은 No. 26-338(Robinhood Derivatives, LLC v. Mike Dreitzer, Nevada Gaming Control Board 의장 외 — 하급심 제9순회 No. 25-7831)로 특정되며, 등재 항목은 2026-09-10 상고허가신청 1건뿐이고 응답 기한은 2026-10-14다. 2026-10-01 조회 시점까지 conference 배당·인용·기각 기록 없음(c_20261001_HOOD_2). 위 원문의 제출일 매체 불일치(09-06/09-09)와 도켓 기재일(09-10)은 정정하지 않고 병기한다. (2)[inference:medium] 응답 기한(10-14)이 9/28보다 뒤이므로 26-338은 9/28 long conference 심리 대상이 아니었을 가능성이 높다 — 위 '첫 검토 기회 2026-09-28' 전제는 성립하지 않았을 수 있다(c_20261001_HOOD_3). (3)[확인 대상 · grade 4 · confirmed=false] D.Conn. CFTC 예비적 금지명령 신청·Robinhood 소송참가 신청은 2026-10-01 현재 결정 없이 계류(c_20261001_HOOD_5). 방향 판정 없음(neutral 유지, 03_signal). 다음 관측점(갱신) = 26-338 응답 기한 2026-10-14 이후 conference 배당·처리, D.Conn. 결정, 제6순회 Kalshi 판결(2026-09-25, 섹터 사건 — HOOD L2 미적재, 04_sector esc_1001_02)의 본 축 귀속 여부]"}
