  # 2026-09-12 ThesisPatch(annotate, run 20260911_2308) — 이전 축: {id: power_permit, label: "전력·인허가 (TX SB6, PUCT, DC 모라토리엄)"}(P9 보존). 축은 유지하고 2026-09-08 회사 보도자료(grade 1, confirmed)로 확인된 ERCOT Batch Zero 분류 관측점을 병기한다. 축 수 6개 불변(전문 기준 계수). ⚠️분류는 조건부이며 최종 접속 승인이 아니다. SB6 비상 커테일먼트 트랙과 별개 규제 트랙이므로 KC-10 첫 번째 조건(계약 용량 10%+ 강제 감축 분류)의 분모 공백은 해소되지 않는다.
  - {id: power_permit,         label: "전력·인허가 (TX SB6, PUCT, DC 모라토리엄). 관측점 2026-09-08(회사 보도자료 grade 1 confirmed): 2GW Sweetwater Hub(Sweetwater1 1,400MW + Sweetwater2 600MW) 전량이 ERCOT Batch Zero 심사에서 Base Load로 조건부 포함. 보도자료가 최종 접속 승인이 아님·에너지화 일자 미확정을 명시하며 송배전사업자 계통접속계약 체결을 전제로 단다 — 계약존재≠이행 3단 분리 준용(P7). 이 분류는 SB6 비상 커테일먼트 의무와 별개 규제 트랙이므로 KC-10의 계약 용량 10%+ 강제 감축 분류 조건과 대조되지 않으며, 그 조건의 분모인 SB6 적용 MW는 여전히 미공시다. Governor Abbott 지시 ERCOT 데이터센터 검증·감사(2026-12 완료 목표) 미종료. Sweetwater1 DC 용량 300MW는 2027 Q4 인도 목표이며 Childress Horizon 1-4와 별개 캠퍼스·별개 일정"}
  # 2026-09-05 ThesisPatch(annotate, run 20260905_0618) — 이전 축: {id: btc_mining, label: "BTC 채굴 현금흐름 (KC-3 연동)"}. 축은 유지하고 회사가 최초로 제시한 종료 목표 시점을 병기한다. 축 수 6개 불변(전문 기준 계수). ⚠️중복 방지 확인: 승인 대기 중인 ap_20260829_1107_* 6건의 대상 필드는 key_metrics·risks·catalysts·earnings_checkpoints·valuation·conclusion이며 axes를 건드리는 패치는 없다. 6건의 after 전문을 대조한 결과 채굴 종료 시점을 담은 서술도 없다 — 필드·내용 모두 비중복.
  - {id: btc_mining,           label: "BTC 채굴 현금흐름 (KC-3 연동). ⚠️2026-08-27 FY26 실적콜에서 CFO Anthony Lewis가 'We currently expect mining operations to be effectively decommissioned by the end of December 2026'로 종료 목표 시점을 최초 제시 (grade 2 — Motley Fool·Seeking Alpha·Benzinga·stockanalysis.com 4개 독립 전사 문자열 일치. 회사 공식 웹캐스트 원본 대조는 미실시 — 잔여 캐비어트). 'currently expect'는 확정 실행이 아닌 현 시점 기대치 표명이므로 이행 완료로 취급하지 않는다(P7). 계획대로면 이 축의 현금흐름 기여는 2026-12월 말로 소멸하며, 리스크는 소멸이 아니라 ai_cloud_conversion으로 완전 이관된다 — 이후 현금흐름 방어선은 전적으로 AI Cloud 가동률·인도 진척에 의존한다. KC-3(BTC < $55,000 + VIX ≥ 25 → IREN 축소 검토)의 IREN 연동 근거도 채굴 종료 시 재검토 대상이나 KC 수정은 사용자 영역이다"}

thesis: >
  토지·전력·DC·GPU 수직 통합으로 임차형 대비 구조적 마진 우위(자체 ~14% vs 임차 ~5%)를 확보한
  사업자가, BTC 채굴 현금흐름을 AI Cloud 계약 매출로 전환한다.
  MS $9.7B + NVIDIA $3.4B + 신규 $2.8B = TCV ~$15.9B. Mirantis 인수로 소프트웨어 레이어 보강.

