  - {id: usdc_market_share,      label: "스테이블코인 시장 내 USDC 점유율 (경쟁 침식 관측 — KC-CRCL-2 판정 대상 -3%p QoQ). 회사 정의 점유율 Q1'26 28% → Q2'26 27% (-1%p QoQ, YoY -66bps, grade 1 confirmed) — 분모는 유통량 $100M 이상·정기 어테스테이션 보유 미달러 스테이블코인으로 한정. 3자 집계(DefiLlama 기반) 약 24%는 전체 공급을 분모로 삼아 약 3%p 격차가 있으며 grade 4·confirmed=false로 삼각검증 항목(P4). 두 계열은 분모 정의가 달라 직접 비교 불가 — KC-CRCL-2 판정 시 어느 계열을 쓰는지 명시 필요. OUSD는 출시 전이라 여전히 점유율 영향 관측 불가이며 자료 부재는 위협 소멸의 반증이 아니다(P5)"}
  # 2026-09-25 ThesisPatch(amend, run 20260925_1015) — 이전 라벨: 'Reserve Income·마진 (금리 직결)'(P9 보존). 이전 서술은 금리 한 변수만 명시해 유통비용(파트너 분배) 쪽 비용 구조가 축 밖에 놓여 있었다. 2026-09-22 8-K로 확인된 Binance 5년 재계약을 비용 구조 관측 항목으로 병기한다. 축 수 8개 불변(전문 86행 기준 계수).
  - {id: reserve_income,    label: "Reserve Income·마진 (금리 직결 + 유통비용 구조). 유통비용 관측 — [fact · grade 1 · confirmed] Circle 자회사와 Binance의 USDC 프로모션 계약 5년 확장·갱신(8-K Item 8.01, 사건일 2026-09-17·제출 2026-09-22). 2024-11·2025-08 기존 계약을 대체하며, Circle은 Binance에 USDC 보유액의 일정 비율인 월간 인센티브 수수료를 지급한다 — 요율·산식·조기해지 트리거는 비공개. 동시에 Binance가 Class A 보통주 1,237,011주를 주당 $80.84(총 $1억)에 사모 인수, 종결 후 2년 락업(c_20260925_CRCL_1). [inference · medium] 파트너 분배 비용이 5년간 잔액 연동 구조로 재고정됐다. 요율 비공개로 마진 영향 크기는 산출 불가이며 과거 Binance向 비용 수치를 대입하지 않는다(c_20260925_CRCL_11). 같은 계약은 usdc_circulation_scale 축에는 유통 채널 고정으로 반대 부호로 들어간다 — 분배계약 본래 구조이며 모순이 아니다. [fact] Coinbase 분배계약은 Item 1.01/1.02 8-K 무공시 약 32일(c_20260925_CRCL_6) — 무공시는 무변경의 증명이 아니다(P5). KC-CRCL-3은 Coinbase 분배계약 정의이며 Binance 산입 여부는 config 결정 영역이다. 관측점: Q3'26 10-Q 계약 주석·유통비용 항목에서 Binance 인센티브 요율·반영 규모 및 Coinbase 분배조건 원문 확인"}
  # 2026-09-05 ThesisPatch(decompose, run 20260905_0618) — 이전 축: {id: competition_ousd, label: "경쟁 — OUSD 컨소시엄·이자부 스테이블코인($YLDS 등)"}. 한 슬롯에 발행 주체·상품 성격(이자부 여부)·관측 가능성이 모두 다른 두 위협원이 혼재해 축 방향의 시계열 해석이 왜곡된다(su_20260905_12). 실제로 이번 run의 strengthen 근거는 OUSD가 아니라 $YLDS 실측이며, 이를 "OUSD 위협 완화"로 읽는 오독이 성립한다. ⚠️P8의 엄격 요건(새 1차 자료가 기존 축 판정을 뒤집음)은 충족하지 않는다 — 축 판정이 뒤집힌 것이 아니라 축이 담는 대상이 갈라진 사례이며, L3는 분해 여부를 카드 소유 계층 판단으로 이관했다. 2026-08-15 승인된 regulation 분해(회사 인가 grade1 vs 섹터 입법 grade3·4가 한 축에서 반대 부호로 상쇄)와 동일 유형이므로 제안하되 채택은 사람 판정이다. 축 수 7 → 8(전문 기준 계수).
  - {id: competition_ousd_consortium, label: "경쟁 — OUSD 컨소시엄 (140+사, 발행·환매 무수수료 + 준비금 수익 파트너 환원 = 수익모델 정면 위협). 2026-09-05 기준 미출시로 실측 유통량이 존재하지 않으며 3 run 연속 상태 진전 없음 — 2026년 하반기 목표(Solana 우선) 반복 확인만. 자료 부재는 위협 소멸의 반증이 아니다(P5). 부호 활성화 조건 = 공식 출시 + 실측 유통량 최초 공시 [2026-10-01 부호 활성화 관측 주석(annotate, run 20261001_0900) — 위 원문은 P9에 따라 보존. (1)[확인 대상 · grade 4 · confirmed=false · 복수 독립 2차 매체 삼각검증] OUSD가 2026-09-30 공식 출시(발행사 Bridge — Stripe 자회사, Base·Ethereum·Solana·Tempo 4개 체인, Coinbase·Stripe·Visa·Mastercard·Shopify 등 창립 파트너 + 200개 이상 기관, 1:1 무료 민팅·환매, 준비자산 수탁 BlackRock·Lead Bank·BNY). 발행사 준비금 대시보드 실측 유통량 $477,338,360(2026-09-30 19:30 UTC) → $468,445,392(2026-10-01 12:50 UTC, 100.00% 담보)(c_20261001_CRCL_3). joinopenstandard.com·reserves.bridge.xyz는 sources.yaml 미등재 도메인이라 default grade 4다. (2)[inference:strong — 조건 충족 판단에 한정] 위 '부호 활성화 조건(공식 출시 + 실측 유통량 최초 공시)'은 관측상 처음 충족됐다(L2·arbiter·L3 모두 weaken). 단 근거 등급이 grade 4이므로 사실 확정이 아니라 확인 대상으로 둔다(P4). 출시일 표기는 산출물 간 상이(CRCL 09-30 / COIN 09-23 출시·09-30 가용성 확대, 04_sector su_1001_04) — 정정 없이 병기(P9). (3)[inference:medium] 규모는 USDC(2차 집계 약 $74~75B, c_20261001_CRCL_10, grade 4) 대비 약 0.6%로 현시점 수익 직접 잠식은 미미하다 — '수익모델 정면 위협'의 구조가 실체화됐다는 의미이며 점유율이 유의미하게 이동했다는 의미가 아니다. 첫 24시간 스냅샷은 소폭 감소로 추세 판단 불가. KC-CRCL-2는 판정 분모 신규치 부재로 not_met/provisional(03_signal). 다음 관측점 = OUSD 유통량 지속 추이(월간 어테스테이션), Q3'26 실적의 OUSD발 USDC 잠식 신호, reserves.bridge.xyz 등급 등재 여부(사람 영역)]"}
  - {id: competition_yield_bearing, label: "경쟁 — 이자부 스테이블코인 ($YLDS 등). 실측 관측이 가능한 축. $YLDS 유통량 4Q25 $328.193M → 1Q26 $598M → 2Q26 $556.033M(QoQ -7.0%), 전부 발행사 FIGR 1차 공시 grade 1. USDC 분기말 $73.3B 대비 1% 미만. 위협의 실질은 규모가 아니라 CLARITY 이자조항 문언에 조건부이며 문언은 미확정"}
